name: Go ACC Tests

on: 
  push:
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "integration/main" ]

jobs:
  build:

    runs-on: self-hosted
    concurrency:
      group: ONTAP-ACC
      cancel-in-progress: false
    # because Dependabot dosn't get access to secrets, and we don't need it to run our ACC TEST, let skip them for that user
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # - name: Print the base branch name
      #   run: |
      #     echo "Base branch: ${{ github.event.pull_request.base.ref }}"
      #     echo "Head branch: ${{ github.event.pull_request.head.ref }}"
      #     echo "Push name: ${{ github.base_ref }}"
      # - name: Detect changed resource files
      #   id: changes
      #   run: |
      #     CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} | grep '.*resource.go$')
      #     echo "Changed resource files: $CHANGED_FILES"
      #     echo "::set-output name=changed_files::$CHANGED_FILES"

      # - name: Detect changed resource files
      #   id: changes
      #   run: |
      #     CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} | grep '.*resource.go$' || true)
      #     if [ -z "$CHANGED_FILES" ]; then
      #       echo "No resource files changed."
      #       echo "changed_files=" >> $GITHUB_ENV
      #       exit 0
      #     fi
      #     echo "Changed resource files: $CHANGED_FILES"
      #     echo "changed_files=$CHANGED_FILES" >> $GITHUB_ENV

      - name: Fetch base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin +refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          else
            git fetch origin +refs/heads/${GITHUB_REF#refs/heads/}:refs/remotes/origin/${GITHUB_REF#refs/heads/}
          fi

      - name: Detect changed resource files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_BRANCH=${{ github.event.pull_request.base.ref }}
          else
            BASE_BRANCH=${GITHUB_REF#refs/heads/}
          fi
          CHANGED_FILES=$(git diff --name-only origin/$BASE_BRANCH | grep '.*resource.go$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No resource files changed."
            echo "changed_files=" >> $GITHUB_ENV
            exit 0
          fi
          echo "Changed resource files: $CHANGED_FILES"
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_ENV

      - name: Build
        if: env.changed_files != ''
        env:
          TF_ACC_NETAPP_HOST: ${{ secrets.TF_ACC_NETAPP_HOST }}
          TF_ACC_NETAPP_HOST2: ${{ secrets.TF_ACC_NETAPP_HOST2 }}
          TF_ACC_NETAPP_HOST3: ${{ secrets.TF_ACC_NETAPP_HOST3 }}
          TF_ACC_NETAPP_HOST4: ${{ secrets.TF_ACC_NETAPP_HOST4 }}
          TF_ACC_NETAPP_HOST5: ${{ secrets.TF_ACC_NETAPP_HOST5 }}
          TF_ACC_NETAPP_HOST_CIFS: ${{ secrets.TF_ACC_NETAPP_HOST_CIFS }}
          TF_ACC_NETAPP_USER: ${{ secrets.TF_ACC_NETAPP_USER }}
          TF_ACC_NETAPP_PASS: ${{ secrets.TF_ACC_NETAPP_PASS }}
          TF_ACC_NETAPP_PASS2: ${{ secrets.TF_ACC_NETAPP_PASS2 }}
          TF_ACC_NETAPP_PASS_CIFS: ${{ secrets.TF_ACC_NETAPP_PASS_CIFS }}
          TF_ACC_NETAPP_LICENSE: ${{ secrets.TF_ACC_NETAPP_LICENSE }}
          TF_ACC_NETAPP_CIFS_ADDOMAIN_PASS: ${{ secrets.TF_ACC_NETAPP_CIFS_ADDOMAIN_PASS }}
        run: |
          export GOFLAGS=-buildvcs=false
          export TF_ACC=1
          export TMPDIR=~/tmp/
          for FILE in $changed_files; do
            TEST_FILE="${FILE%.go}_test.go"
            if [ -f "$TEST_FILE" ]; then
              go test "$TEST_FILE"
            else
              echo "Test file $TEST_FILE does not exist."
            fi
          done

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/tmp/
