name: Go build
on:
  push:
    branches:
      - "integration/main"
      - "release*"
  pull_request:
    branches:
      - "integration/main"
      - "release*"

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: |
          export GOFLAGS=-buildvcs=false
          go build -v -o .
