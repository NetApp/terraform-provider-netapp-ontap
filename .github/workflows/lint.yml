name: Go Lint

on:
  push:
    branches:
      - "integration/main"
      - "stable*"
  pull_request:
    branches:
      - "integration/main"
      - "stable*"

jobs:
  ci:
    name: "Run CI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
